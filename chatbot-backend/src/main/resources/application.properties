# Saarthi Mental Health Chatbot Backend Configuration

# Server Configuration
server.port=8080
server.servlet.context-path=/api
spring.application.name=saarthi-chatbot

# Logging Configuration
logging.level.root=INFO
logging.level.com.saarthi.chatbot=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# External LLM API Configuration (Groq, OpenAI, etc.)
# We use Groq for the free tier because it provides blazing fast Llama 3 models.
# Get a free API key at https://console.groq.com
llm.api.key=${LLM_API_KEY:}
llm.api.url=${LLM_API_URL:https://api.groq.com/openai/v1/chat/completions}
llm.model=${LLM_MODEL:llama3-8b-8192}
llm.temperature=0.7

# Chatbot Configuration
chatbot.max-conversation-history=5
chatbot.session-timeout-minutes=30
chatbot.response-validation.enabled=true

# CORS Configuration (Set CORS_ALLOWED_ORIGINS in production to your Vercel URL)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4321,http://localhost:5173,http://localhost:3000}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.max-age=3600

# Jackson Configuration (JSON serialization)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null