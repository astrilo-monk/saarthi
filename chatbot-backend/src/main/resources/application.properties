# Saarthi Mental Health Chatbot Backend Configuration

# Server Configuration
# Render provides PORT env var; fallback to 8080 locally
server.port=${PORT:8080}
server.servlet.context-path=/api
spring.application.name=saarthi-chatbot

# Logging Configuration
logging.level.root=INFO
logging.level.com.saarthi.chatbot=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Groq API Configuration
# Sign up for free at https://console.groq.com
# Set your API key as an environment variable: GROQ_API_KEY=gsk_...
groq.api-key=${GROQ_API_KEY:}
groq.model=llama-3.3-70b-versatile
groq.temperature=0.7
groq.top-p=0.9
groq.max-tokens=512

# Chatbot Configuration
chatbot.max-conversation-history=5
chatbot.session-timeout-minutes=30
chatbot.response-validation.enabled=true

# CORS Configuration
# CORS_ALLOWED_ORIGINS env var overrides for production (comma-separated)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://saarthi-jet.vercel.app,http://localhost:4321,http://localhost:5173,http://localhost:3000}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.max-age=3600

# Jackson Configuration (JSON serialization)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null